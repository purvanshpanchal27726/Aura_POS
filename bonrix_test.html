      function readBinaryFile(url, callback) {
	  try
	  {
        fetch(url)
          .then((response) => response.arrayBuffer())
          .then((arrayBuffer) => {
            var byteArray = new Uint8Array(arrayBuffer);
            callback(byteArray);
          })
          .catch((error) => {
            console.error("Error fetching binary file:", error);
          });
		  }
		  catch
		  {
		  enable()
		  }
      }

      async function connect() {
	  try{
        const options = {
          baudRate: 115200,
          dataBits: 8, // Set the number of data bits (5, 6, 7, or 8)
          stopBits: 1, // Set the number of stop bits (1 or 2)
          parity: "none", // Set the parity (none, even, or odd)
        };
        serialPort = await navigator.serial.requestPort();
        await serialPort.open(options);
        readLoop();
		 }
		  catch
		  {
		  enable()
		  }
      }

      function disconnect() {
	  try
	  {
        if (serialPort) {
          serialPort.close();
        }
		 }
		  catch
		  {
		  enable()
		  }
      }

      async function writeToSerialImage(data) {
	  try
	  {
        if (serialPort) {
          const writer = serialPort.writable.getWriter();
          await writer.write(data);
          writer.releaseLock();
		  enable()
        }
		 }
		  catch
		  {
		  enable()
		  }
      }

      async function readLoop() {
	  try
	  {
        if (serialPort) {
          const reader = serialPort.readable.getReader();
          try {
            while (true) {
              const { value, done } = await reader.read();
              if (done) {
                console.log("Read loop finished, done is true");
                reader.releaseLock();
                break;
              }

              console.log(value);
              const decoder = new TextDecoder();
              const text = decoder.decode(value);
              document.getElementById("output").innerText += text + "\n";
            }
          } catch (error) {
            console.error("Serial read error:", error);
          }
        }
		 }
		  catch
		  {
		  enable()
		  }
      }
